# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Install sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt test
    - name: Check module boundaries (meta <-> rdfStore must not depend on each other)
      run: sbt checkModuleBoundaries
    - name: Check meta's src/ does not import rdfStore internals (docs/rdf-common-split/22-ci-guard.md)
      # Complements checkModuleBoundaries with a source-level check that gives a more helpful
      # message on the exact offending line.
      run: |
        ! grep -rn '^[[:space:]]*import se\.lu\.nateko\.cp\.meta\.rdfstore' src/
        ! grep -rn 'sparql\.magic\|sparql\.index' src/main
