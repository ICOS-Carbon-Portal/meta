
akka {
	loggers = ["akka.event.slf4j.Slf4jLogger"]
	logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
	log-dead-letters = 0
	akka.log-dead-letters-during-shutdown = 0
	jvm-exit-on-fatal-error = off


	http{
		parsing.max-to-strict-bytes = 50m
		server{
			idle-timeout = 300 s
			request-timeout = infinite
			parsing {
				max-uri-length = 8k
				max-content-length = 50m
				max-to-strict-bytes = 50m
				illegal-header-warnings = off
			}
		}
	}
	# akka.http.caching.lfu-cache is set in rdfstore/src/main/resources/reference.conf:
	# rdfStore's SparqlRoute is the only LfuCache user.
}

# No `rdfStore { ... }` defaults live here: every key of that section is read only by
# `rdfStore`'s own `RdfStoreConfigLoader` and is defined in
# rdfstore/src/main/resources/reference.conf. (`meta` needs a `rdfStore.rdfLog` fallback to
# resolve its `cpmeta.rdfLog = ${rdfStore.rdfLog}` substitution, since it no longer has
# rdfstore's reference.conf on its classpath -- that fallback lives in `meta`'s own
# src/main/resources/reference.conf, next to the substitution that needs it.)

# The `cpmeta { ... }` defaults below are the small defaults both `meta` and `rdfStore` read.
# `rdfStore`'s own config loader (`RdfStoreConfigLoader` in rdfstore/StoreConfig.scala) parses
# narrow views of this section -- `CitationCpmetaView` (core, citations,
# dataUploadService.handle) -- rather than the whole `CpmetaConfig` object (see
# docs/rdf-common-split/15-split-config.md). Only genuinely identical defaults live here;
# meta's complete `instanceServers` configuration lives with that application; rdfStore owns a
# separate direct `rdfStore.citationGraphs` view. Everything only `meta`'s own `CpmetaConfig`
# reads (`onto`, `stationLabelingService`, `fileStoragePath`, `remoteRdfRepository`, `rdfLog`,
# `dataUploadService.etc`, `auth`, `statsClient`, meta's own `port`/`httpBindInterface`, ...) is
# in `meta`'s own src/main/resources/reference.conf, and everything only `rdfStore` reads
# (`rdfStore.sparql`'s throttling knobs) is in rdfstore's.
cpmeta{
	dataUploadService{
		metaServers: {
			ICOS: "icos"
			SITES: "sitesmeta"
		}
		collectionServers: {
			ICOS: "icoscolls"
			SITES: "sitescolls"
		}
		documentServers: {
			ICOS: "icosdocs"
			SITES: "sitesdocs"
		}
		handle {
			prefix: {
				ICOS: "11676"
				SITES: "11676.1"
			}
			baseUrl: "https://epic.pdc.kth.se:8000/"
			serverCertPemFilePath: "ssl/kth_pdc_server_cert.pem" //is optional if the server has proper cert
			clientCertPemFilePath: "ssl/handleClientCert.pem"
			clientPrivKeyPKCS8FilePath: "ssl/handleClientPrivKey.der"
			dryRun: false
		}
		# dataUploadService.etc is meta-only (only EtcUploadTransformer/IcosMetaFlow read it) and
		# lives in meta's own reference.conf; Typesafe Config merges it into this same object.
	}


	core = ${metacore} //substituted from meta-core reference config

	citations{
		style = "elsevier-harvard"
		eagerWarmUp = true
		timeoutSec = 3
		doi {
			restEndpoint: "https://api.datacite.org/"
			envries {
				ICOS {
					symbol: "SND.ICOS"
					password: "dummy"
					doiPrefix: "10.18160"
				}
				ICOSCities = ${cpmeta.citations.doi.envries.ICOS}
				SITES {
					symbol: "SND.SITES"
					password: "dummy"
					doiPrefix: "10.23700"
				}
			}
		}
	}

}
