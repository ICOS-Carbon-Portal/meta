# rdf-common/src/main/resources/reference.conf's `cpmeta` block cross-references
# `rdfStore.rdfLog` / `rdfStore.rdfStorage` (see the comment there, and task 15 in
# docs/rdf-common-split for why the split isn't narrower yet). Those keys are normally
# supplied by rdfStore/src/main/resources/reference.conf, which is on the classpath of the
# full `meta` and `rdfStore` apps but not of rdfCommon's own isolated test run. Any test that
# constructs an ActorSystem (even for something unrelated to config, like Akka Streams
# behaviour) forces typesafe-config to resolve every reference.conf found on the classpath,
# so rdfCommon's test classpath needs a stand-in for the keys it doesn't own.
rdfStore {
	rdfLog {
		server { host = "localhost", port = 5432 }
		credentials { db = "postgres", user = "postgres", password = "dummy" }
	}
	rdfStorage {
		lmdb = { tripleDbSize = 8589934592, valueDbSize = 8589934592, valueCacheSize = 16384 }
		path = "./rdfStorage"
		recreateAtStartup = false
		indices = "spoc,posc,opsc"
		disableCpIndex = false
		recreateCpIndexAtStartup = false
	}
}
