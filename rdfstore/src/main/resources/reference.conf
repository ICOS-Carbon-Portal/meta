
# Store-owned defaults (task 16). This section used to live in the monolithic
# application.conf shipped by rdfstore; it moved here verbatim as part of the
# reference.conf split. See rdf-common/src/main/resources/reference.conf for
# the shared `akka` and `cpmeta` defaults that both `meta` and `rdfStore` need
# -- `rdfStore`'s own `RdfStoreConfigLoader` (rdfstore/StoreConfig.scala) parses
# only its own narrow views of `cpmeta` (`CitationStoreConfig`, `SparqlServerConfig`),
# not the whole object, so the `cpmeta.*` keys only `meta` ever reads live in
# `meta`'s own src/main/resources/reference.conf instead.

# rdfStore is the only LfuCache user (rdfstore/SparqlRoute.scala), so the cache tuning
# is store-owned rather than shared.
akka.http.caching.lfu-cache {
	time-to-live = 60 minutes
	time-to-idle = 60 minutes
}

# The store-only half of `cpmeta.sparql`: query throttling, read by `SparqlServerConfig`
# (StoreConfig.scala) for Rdf4jSparqlServer/QuotaManager. `adminUsers`, the one key of this
# section `meta` reads too, is defined in rdf-common's reference.conf and merged in here.
cpmeta.sparql {
	maxQueryRuntimeSec = 9
	quotaPerMinute = 20
	quotaPerHour = 300
	maxParallelQueries = 5
	maxQueryQueue = 100
	banLength = 10
	maxCacheableQuerySize = 8388608
}

rdfStore {
	httpBindInterface = "127.0.0.1"
	port = 9095
	# `meta` keeps its own literal copy of `rdfLog` (in meta's src/main/resources/reference.conf),
	# as the source of its `cpmeta.rdfLog = ${rdfStore.rdfLog}` substitution: meta's classpath has
	# not carried this file since task 21 removed meta.dependsOn(rdfStore). Keep the two copies
	# identical -- they are the same deployment's database, and operators override `rdfStore.rdfLog`
	# for both apps.
	rdfLog {
		server { host = "localhost", port = 5432 }
		credentials { db = "postgres", user = "postgres", password = "dummy" }
	}
	rdfStorage {
		lmdb = { tripleDbSize = 8589934592, valueDbSize = 8589934592, valueCacheSize = 16384 }
		path = "./rdfStorage"
		recreateAtStartup = false
		indices = "spoc,posc,opsc"
		disableCpIndex = false
		recreateCpIndexAtStartup = false
	}
	# RDF-log ownership is local to rdfStore: log name -> named graph.
	rdfLogs {
		instances = "http://meta.icos-cp.eu/resources/cpmeta/"
		otcentry = "http://meta.icos-cp.eu/resources/otcmeta/"
		icos = "http://meta.icos-cp.eu/resources/icos/"
		icoscolls = "http://meta.icos-cp.eu/collections/"
		sitescolls = "https://meta.fieldsites.se/collections/"
		icosdocs = "http://meta.icos-cp.eu/documents/"
		sitesdocs = "https://meta.fieldsites.se/documents/"
		stations = "http://meta.icos-cp.eu/resources/stationentry/"
		labeling = "http://meta.icos-cp.eu/resources/stationlabeling/"
		sitesmeta = "https://meta.fieldsites.se/resources/sites/"
		wdcgg = "http://meta.icos-cp.eu/resources/wdcgg/"
		atmcsv = "http://meta.icos-cp.eu/resources/atmcsv/"
		atmprodcsv = "http://meta.icos-cp.eu/resources/atmprodcsv/"
		atmflaskprod = "http://meta.icos-cp.eu/resources/atmflaskprod/"
		etcprodcsv = "http://meta.icos-cp.eu/resources/etcprodcsv/"
		otcprodcsv = "http://meta.icos-cp.eu/resources/otcprodcsv/"
		otcraw = "http://meta.icos-cp.eu/resources/otcraw/"
		etcmulti = "http://meta.icos-cp.eu/resources/etcmulti/"
		imagezip = "http://meta.icos-cp.eu/resources/imagezip/"
		etccsv = "http://meta.icos-cp.eu/resources/etccsv/"
		etcbin = "http://meta.icos-cp.eu/resources/etcbin/"
		etcbif = "http://meta.icos-cp.eu/resources/etcbif/"
		ecocsv = "http://meta.icos-cp.eu/resources/ecocsv/"
		tscsv = "http://meta.icos-cp.eu/resources/tscsv/"
		socat = "http://meta.icos-cp.eu/resources/socat/"
		netcdf = "http://meta.icos-cp.eu/resources/netcdf/"
		netcdftimeser = "http://meta.icos-cp.eu/resources/netcdftimeser/"
		ingosrar = "http://meta.icos-cp.eu/resources/ingosrar/"
		excel = "http://meta.icos-cp.eu/resources/excel/"
		image = "http://meta.icos-cp.eu/resources/image/"
		ziparch = "http://meta.icos-cp.eu/resources/ziparch/"
		sitesimage = "https://meta.fieldsites.se/resources/sitesimage/"
		siteszip = "https://meta.fieldsites.se/resources/siteszip/"
		sitesdelimitedheadercsv = "https://meta.fieldsites.se/resources/sitesdelimitedheadercsv/"
		sitesprojects = "https://meta.fieldsites.se/resources/sitesprojects/"
		sitesaquanetpointmeasurementscsv = "https://meta.fieldsites.se/resources/sitesaquanetpointmeasurementscsv/"
		sitesspectralpointcloud = "https://meta.fieldsites.se/resources/sitesspectralpointcloud/"
	}
	# Optional per-log partial replay offsets, used only during initial restore.
	rdfLogRestoreFromId = {}
}
