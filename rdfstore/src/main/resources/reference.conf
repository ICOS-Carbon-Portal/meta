
# Store-owned defaults (task 16). This section used to live in the monolithic
# application.conf shipped by rdfstore; it moved here verbatim as part of the
# reference.conf split. See rdf-common/src/main/resources/reference.conf for
# the common `cpmeta` defaults that both `meta` and `rdfStore` need
# -- `rdfStore`'s own `RdfStoreConfigLoader` (rdfstore/StoreConfig.scala) parses
# only its shared `cpmeta` citation view (`CitationCpmetaView`) and its own
# `rdfStore.sparql` view (`SparqlServerConfig`),
# not the whole object. Citation graph scopes are store-owned under `rdfStore.citationGraphs`;
# meta's complete instance-server view lives in meta's own src/main/resources/reference.conf.

# Runtime policy belongs to this independently deployable service. Keep changes here local to
# rdfStore; meta owns its Akka configuration in src/main/resources/reference.conf.
akka {
	loggers = ["akka.event.slf4j.Slf4jLogger"]
	logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
	log-dead-letters = 0
	akka.log-dead-letters-during-shutdown = 0
	jvm-exit-on-fatal-error = off

	http {
		parsing.max-to-strict-bytes = 50m
		server {
			idle-timeout = 300 s
			request-timeout = infinite
			parsing {
				max-uri-length = 8k
				max-content-length = 50m
				max-to-strict-bytes = 50m
				illegal-header-warnings = off
			}
		}

		# rdfStore is the only LfuCache user (SparqlRoute.scala).
		caching.lfu-cache {
			time-to-live = 60 minutes
			time-to-idle = 60 minutes
		}
	}
}


rdfStore {
	httpBindInterface = "127.0.0.1"
	port = 9095
	sparql {
		maxQueryRuntimeSec = 9
		quotaPerMinute = 20
		quotaPerHour = 300
		maxParallelQueries = 5
		maxQueryQueue = 100
		banLength = 10
		maxCacheableQuerySize = 8388608
	}
	# `meta` keeps its own literal copy of `rdfLog` (in meta's src/main/resources/reference.conf),
	# as the source of its `cpmeta.rdfLog = ${rdfStore.rdfLog}` substitution: meta's classpath has
	# not carried this file since task 21 removed meta.dependsOn(rdfStore). Keep the two copies
	# identical -- they are the same deployment's database, and operators override `rdfStore.rdfLog`
	# for both apps.
	rdfLog {
		server { host = "localhost", port = 5432 }
		credentials { db = "postgres", user = "postgres", password = "dummy" }
	}
	rdfStorage {
		lmdb = { tripleDbSize = 8589934592, valueDbSize = 8589934592, valueCacheSize = 16384 }
		path = "./rdfStorage"
		recreateAtStartup = false
		indices = "spoc,posc,opsc"
		disableCpIndex = false
		recreateCpIndexAtStartup = false
	}
	# RDF-log ownership is local to rdfStore: log name -> named graph.
	rdfLogs {
		instances = "http://meta.icos-cp.eu/resources/cpmeta/"
		otcentry = "http://meta.icos-cp.eu/resources/otcmeta/"
		icos = "http://meta.icos-cp.eu/resources/icos/"
		icoscolls = "http://meta.icos-cp.eu/collections/"
		sitescolls = "https://meta.fieldsites.se/collections/"
		icosdocs = "http://meta.icos-cp.eu/documents/"
		sitesdocs = "https://meta.fieldsites.se/documents/"
		stations = "http://meta.icos-cp.eu/resources/stationentry/"
		labeling = "http://meta.icos-cp.eu/resources/stationlabeling/"
		sitesmeta = "https://meta.fieldsites.se/resources/sites/"
		wdcgg = "http://meta.icos-cp.eu/resources/wdcgg/"
		atmcsv = "http://meta.icos-cp.eu/resources/atmcsv/"
		atmprodcsv = "http://meta.icos-cp.eu/resources/atmprodcsv/"
		atmflaskprod = "http://meta.icos-cp.eu/resources/atmflaskprod/"
		etcprodcsv = "http://meta.icos-cp.eu/resources/etcprodcsv/"
		otcprodcsv = "http://meta.icos-cp.eu/resources/otcprodcsv/"
		otcraw = "http://meta.icos-cp.eu/resources/otcraw/"
		etcmulti = "http://meta.icos-cp.eu/resources/etcmulti/"
		imagezip = "http://meta.icos-cp.eu/resources/imagezip/"
		etccsv = "http://meta.icos-cp.eu/resources/etccsv/"
		etcbin = "http://meta.icos-cp.eu/resources/etcbin/"
		etcbif = "http://meta.icos-cp.eu/resources/etcbif/"
		ecocsv = "http://meta.icos-cp.eu/resources/ecocsv/"
		tscsv = "http://meta.icos-cp.eu/resources/tscsv/"
		socat = "http://meta.icos-cp.eu/resources/socat/"
		netcdf = "http://meta.icos-cp.eu/resources/netcdf/"
		netcdftimeser = "http://meta.icos-cp.eu/resources/netcdftimeser/"
		ingosrar = "http://meta.icos-cp.eu/resources/ingosrar/"
		excel = "http://meta.icos-cp.eu/resources/excel/"
		image = "http://meta.icos-cp.eu/resources/image/"
		ziparch = "http://meta.icos-cp.eu/resources/ziparch/"
		sitesimage = "https://meta.fieldsites.se/resources/sitesimage/"
		siteszip = "https://meta.fieldsites.se/resources/siteszip/"
		sitesdelimitedheadercsv = "https://meta.fieldsites.se/resources/sitesdelimitedheadercsv/"
		sitesprojects = "https://meta.fieldsites.se/resources/sitesprojects/"
		sitesaquanetpointmeasurementscsv = "https://meta.fieldsites.se/resources/sitesaquanetpointmeasurementscsv/"
		sitesspectralpointcloud = "https://meta.fieldsites.se/resources/sitesspectralpointcloud/"
	}

	# Optional per-log partial replay offsets, used only during initial restore.
	rdfLogRestoreFromId = {}

	# rdfStore's independent graph topology for citation reads. These scopes intentionally use no
	# instance-server, ingestion, RDF-log, editor, ontology or metaflow configuration.
	citationGraphs {
		collections {
			ICOS {
				readContexts: ["http://meta.icos-cp.eu/collections/", "http://meta.icos-cp.eu/resources/cpmeta/", "http://meta.icos-cp.eu/ontologies/cpmeta/", "http://meta.icos-cp.eu/resources/icos/"]
				primaryContext: "http://meta.icos-cp.eu/collections/"
			}
			SITES {
				readContexts: ["https://meta.fieldsites.se/collections/", "https://meta.fieldsites.se/resources/sites/"]
				primaryContext: "https://meta.fieldsites.se/collections/"
			}
		}
		documents {
			ICOS {
				readContexts: [
					"http://meta.icos-cp.eu/documents/",
					"http://meta.icos-cp.eu/resources/cpmeta/",
					"http://meta.icos-cp.eu/ontologies/cpmeta/",
					"http://meta.icos-cp.eu/resources/extrastations/",
					"http://meta.icos-cp.eu/resources/icos/"
				]
				primaryContext: "http://meta.icos-cp.eu/documents/"
			}
			SITES {
				readContexts: ["https://meta.fieldsites.se/documents/", "https://meta.fieldsites.se/resources/sites/", "http://meta.icos-cp.eu/ontologies/cpmeta/"]
				primaryContext: "https://meta.fieldsites.se/documents/"
			}
		}
		dataObjects {
			ICOS: {
				commonReadContexts: [
					"http://meta.icos-cp.eu/resources/cpmeta/",
					"http://meta.icos-cp.eu/ontologies/cpmeta/",
					"http://meta.icos-cp.eu/resources/icos/",
					"http://meta.icos-cp.eu/resources/extrastations/"
				]
				uriPrefix: "http://meta.icos-cp.eu/resources/"
				definitions: [
					{ label: "wdcgg", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiWdcggTimeSer"},
					{ label: "atmcsv", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiAtcTimeSer"},
					{ label: "atmprodcsv", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiAtcProductTimeSer"},
					{ label: "atmflaskprod", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiAtcFlaskTimeSer"},
					{ label: "etcprodcsv", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiEtcHalfHourlyProductTimeSer"},
					{ label: "otcprodcsv", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiOtcProductCsv"},
					{ label: "otcraw", format: "http://meta.icos-cp.eu/ontologies/cpmeta/otcRawData"},
					{ label: "etcmulti", format: "http://meta.icos-cp.eu/ontologies/cpmeta/etcRawTimeSerMultiZip"},
					{ label: "imagezip", format: "http://meta.icos-cp.eu/ontologies/cpmeta/multiImageZip"},
					{ label: "etccsv", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiEtcRawTimeSer"},
					{ label: "etcbin", format: "http://meta.icos-cp.eu/ontologies/cpmeta/binEtcRawTimeSer"},
					{ label: "etcbif", format: "http://meta.icos-cp.eu/ontologies/cpmeta/badmIF"},
					{ label: "ecocsv", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiEtcTimeSer"},
					{ label: "tscsv", format: "http://meta.icos-cp.eu/ontologies/cpmeta/csvWithIso8601tsFirstCol"},
					{ label: "socat", format: "http://meta.icos-cp.eu/ontologies/cpmeta/asciiOtcSocatTimeSer"},
					{ label: "netcdf", format: "http://meta.icos-cp.eu/ontologies/cpmeta/netcdf"},
					{ label: "netcdftimeser", format: "http://meta.icos-cp.eu/ontologies/cpmeta/netcdfTimeSeries"},
					{ label: "ingosrar", format: "http://meta.icos-cp.eu/ontologies/cpmeta/ingosRar"},
					{ label: "excel", format: "http://meta.icos-cp.eu/ontologies/cpmeta/excel"},
					{ label: "image", format: "http://meta.icos-cp.eu/ontologies/cpmeta/image"},
					{ label: "ziparch", format: "http://meta.icos-cp.eu/ontologies/cpmeta/zipArchive"},
				]
			}
			SITES: {
				commonReadContexts: [
					"https://meta.fieldsites.se/resources/sites/",
					"http://meta.icos-cp.eu/ontologies/cpmeta/"
				]
				uriPrefix: "https://meta.fieldsites.se/resources/"
				definitions: [
					{ label: "sitesimage", format: "https://meta.fieldsites.se/ontologies/sites/image"},
					{ label: "siteszip", format: "http://meta.icos-cp.eu/ontologies/cpmeta/zipArchive"},
					{ label: "sitesdelimitedheadercsv", format: "https://meta.fieldsites.se/ontologies/sites/delimitedHeaderCsv"},
					{ label: "sitesprojects", format: "https://meta.fieldsites.se/ontologies/sites/communityProjects"},
					{ label: "sitesaquanetpointmeasurementscsv", format: "https://meta.fieldsites.se/ontologies/sites/aquanetPointMeasurementsCsv"},
					{ label: "sitesspectralpointcloud", format: "https://meta.fieldsites.se/ontologies/sites/spectralPointCloud"},
				]
			}
		}
	}
}
