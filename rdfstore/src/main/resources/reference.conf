# rdfStore-owned classpath defaults. Defaults under cpmeta that are also read by meta
# live in rdf-common/src/main/resources/reference.conf.

# Runtime policy belongs to this independently deployable service. Keep changes here local to
# rdfStore; meta owns its Akka configuration in src/main/resources/reference.conf.
akka {
	loggers = ["akka.event.slf4j.Slf4jLogger"]
	logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
	log-dead-letters = 0
	akka.log-dead-letters-during-shutdown = 0
	jvm-exit-on-fatal-error = off

	http {
		parsing.max-to-strict-bytes = 50m
		server {
			idle-timeout = 300 s
			request-timeout = infinite
			parsing {
				max-uri-length = 8k
				max-content-length = 50m
				max-to-strict-bytes = 50m
				illegal-header-warnings = off
			}
		}

		# rdfStore is the only LfuCache user (SparqlRoute.scala).
		caching.lfu-cache {
			time-to-live = 60 minutes
			time-to-idle = 60 minutes
		}
	}
}

rdfStore {
	httpBindInterface = "127.0.0.1"
	port = 9095
	citations {
		style = "elsevier-harvard"
		eagerWarmUp = true
		timeoutSec = 3
	}
	sparql {
		maxQueryRuntimeSec = 9
		quotaPerMinute = 20
		quotaPerHour = 300
		maxParallelQueries = 5
		maxQueryQueue = 100
		banLength = 10
		maxCacheableQuerySize = 8388608
	}
	rdfStorage {
		lmdb = { tripleDbSize = 8589934592, valueDbSize = 8589934592, valueCacheSize = 16384 }
		path = "./rdfStorage"
		recreateAtStartup = false
		indices = "spoc,posc,opsc"
		disableCpIndex = false
	}
	# Static OWL schema graphs, not recoverable from the rdf log; rdfStore ingests
	# them into the store itself at startup, before serving any SPARQL queries.
	schemaOntologies = [
		{ writeContext = "http://meta.icos-cp.eu/ontologies/cpmeta/", owlResource = "/owl/cpmeta.owl" }
		{ writeContext = "http://meta.icos-cp.eu/ontologies/stationentry/", owlResource = "/owl/stationEntry.owl" }
		{ writeContext = "http://meta.icos-cp.eu/ontologies/otcmeta/", owlResource = "/owl/otcmeta.owl" }
	]
}
