# meta-owned classpath defaults (task 16).
#
# rdfStore's own config loader (`RdfStoreConfigLoader`) now parses only its own narrow views of
# `cpmeta` -- `CitationStoreConfig` (core, citations, instanceServers, dataUploadService's
# metaServers/collectionServers/documentServers/handle) and `SparqlServerConfig` (cpmeta.sparql)
# -- instead of the whole `CpmetaConfig` object (see StoreConfig.scala and
# services/citation/CitationStoreConfig.scala). That is the narrowing task 15
# (docs/rdf-common-split/15-split-config.md) was waiting on, so the `cpmeta.*` keys that only
# `meta`'s own `CpmetaConfig` (src/main/scala/CpmetaConfig.scala) reads can finally live here
# instead of in rdf-common/src/main/resources/reference.conf, where they used to have to stay
# reachable from rdfStore's classpath too.
#
# Keys that remain in rdf-common's reference.conf are the ones `rdfStore` still genuinely reads:
# cpmeta.core, cpmeta.citations, cpmeta.sparql.adminUsers, cpmeta.instanceServers and
# cpmeta.dataUploadService's metaServers/collectionServers/documentServers/handle. Where only
# part of a HOCON object is shared, the meta-only keys are defined here and merged in by
# Typesafe Config -- see `instanceServers.metaFlow` below.

# `meta` reads `cpmeta.rdfLog` (ConfigLoader -> MetaDb -> PostgresRdfLog); `rdfStore` reads
# `rdfStore.rdfLog`. Both point at the same database, so the substitution below keeps one
# operator-facing knob: override `rdfStore.rdfLog`, never `cpmeta.rdfLog`, and both apps follow.
# Typesafe Config requires every reference.conf to resolve on its own, and meta's classpath has
# not carried rdfstore's since task 21 removed meta.dependsOn(rdfStore) -- hence the literal
# fallback here, which duplicates rdfstore/src/main/resources/reference.conf's `rdfLog`. Keep the
# two copies identical. Nothing in `meta` reads `rdfStore.rdfLog` directly.
rdfStore.rdfLog {
	server { host = "localhost", port = 5432 }
	credentials { db = "postgres", user = "postgres", password = "dummy" }
}

cpmeta{
	port: 9094
	httpBindInterface: "127.0.0.1"

	rdfLog = ${rdfStore.rdfLog}

	# The store-agnostic half of metaFlow (`cpMetaInstanceServerId`, which rdfStore's
	# `MetaFlowRef` also reads) is in rdf-common's reference.conf; these are the fields only
	# meta's `MetaFlowConfig` subtypes use, including the `_type` discriminant that picks between
	# them.
	instanceServers.metaFlow{
		_type = "icos"
		icosMetaInstanceServerId = "icos"
		otcMetaInstanceServerId = "otcentry"
		atcUpload{
			dirName = "atcmeta"
			uploader = "uploader@ATC"
		}
	}

	stationLabelingService{
		instanceServerId: "labeling"
		provisionalInfoInstanceServerId: "stationentry",
		icosMetaInstanceServerId: "icos",
		ontoId: "stationentry"
		tcUserIds: {
			"http://meta.icos-cp.eu/ontologies/stationentry/AS": []
			"http://meta.icos-cp.eu/ontologies/stationentry/ES": []
			"http://meta.icos-cp.eu/ontologies/stationentry/OS": []
		}
		dgUserId = "dummy@dummy.org"
		riComEmail = "dummy@dummy.org"
		calLabEmails = []
		mailSendingActive: false
		mailing = ${cpauthCore.mailing}
		mailing.password = "dummy"
		mailing.logBccAddress: "carbon-portal-mail@nateko.lu.se"
	}

	dataUploadService.etc {
		eddyCovarObjSpecId = "etcEddyFluxRawSeries"
		storageObjSpecId = "etcStorageFluxRawSeries"
		bioMeteoObjSpecId = "etcBioMeteoRawSeries"
		saheatObjSpecId = "etcSaheatFlagFile"
		phenocamObjSpecId = "etcPhenocamDaily"
		metaService = "https://gaia.agraria.unitus.it:14048/cpmeta"
		ingestFileMeta = true
	}

	fileStoragePath: "./fileStorage"
	# meta is always a client of the standalone rdfStore service.
	remoteRdfRepository {
		# the internal endpoint is neither quota-throttled nor response-cached,
		# unlike the public /sparql endpoint served by rdfStore
		queryEndpoint = "http://127.0.0.1:9095/internal/sparql"
		updateEndpoint = "http://127.0.0.1:9095/internal/sparql"
		adminEndpoint = "http://127.0.0.1:9095/admin/read-only"
		derivedMetadataEndpoint = "http://127.0.0.1:9095/internal/derived/v1/resolve"
	}

	onto {
		ontologies: [{
			owlResource: "/owl/uiannotations.owl"
		},{
			owlResource: "/owl/cpmeta.owl"
		},{
			owlResource: "/owl/stationEntry.owl"
		},{
			ontoId: "cpmeta"
			owlResource: "/owl/cpmetaui.owl"
		},{
			ontoId: "stationentry"
			owlResource: "/owl/stationEntryUi.owl"
		},{
			ontoId: "labeling"
			owlResource: "/owl/labelingUi.owl"
		},{
			ontoId: "sitesmeta"
			owlResource: "/owl/sitesmetaui.owl"
		},{
			owlResource: "/owl/otcmeta.owl"
		},{
			ontoId: "otcmeta"
			owlResource: "/owl/otcmetaui.owl"
		},{
			ontoId: "icosmeta"
			owlResource: "/owl/icosmetaui.owl"
		}]

		instOntoServers {
			cpmeta {
				serviceTitle: "Carbon Portal metadata instances"
				authorizedUserIds: []
				ontoId: "cpmeta"
				instanceServerId: "instances"
			}
			icosmeta {
				serviceTitle: "ICOS metadata instances (automatically filled in)"
				authorizedUserIds: []
				ontoId: "icosmeta"
				instanceServerId: "icos"
			}
			stationentry {
				serviceTitle: "Provisional ICOS stations metadata"
				authorizedUserIds: []
				ontoId: "stationentry"
				instanceServerId: "stationentry"
			}
			otcentry {
				serviceTitle: "ICOS OTC metadata entry"
				authorizedUserIds: []
				ontoId: "otcmeta"
				instanceServerId: "otcentry"
			}
			labeling {
				serviceTitle: "Administrative access to ICOS labeling metadata"
				authorizedUserIds: []
				ontoId: "labeling"
				instanceServerId: "labelingForAdmin"
			}
			sitesmeta {
				serviceTitle: "SITES metadata editor"
				authorizedUserIds: []
				ontoId: "sitesmeta"
				instanceServerId: "sitesmeta"
			}
		}
	}

	auth = ${authPub} //substituted from cpauth core config

	statsClient{
		downloadsUri = "http://127.0.0.1:9011/stats/api/downloadCount"

		previews{
			baseUri = "http://127.0.0.1:8088"
			dbNames {
				ICOS: "db"
				SITES: "sitesdb"
			}
		}

	}

}
