@()
<style>
	.col-md-12 > label::after {
		content: ":";
	}
	.col-md-12 > label{
		margin-bottom: 5px;
		vertical-align: top;
	}
	.html-property > :is(p, ul, ol) {
		margin-bottom: 0.35rem;
	}
	.html-property > :is(p, ul, ol):last-child {
		margin-bottom: 0;
	}
	iframe {
		border:solid 1px #ddd;
		width:100%;
		height:400px;
	}
	table.instrument-deployment {
		margin-bottom: 0px;
	}
	table.instrument-deployment td {
		vertical-align: middle;
		border-bottom-width: 0px;
	}

	.wide-cover-image {
		height: 450px;
		width: 100vw;
		position: relative;
		left: -12px;
		top: -24px;
		text-shadow: -1px 1px 2px var(--bs-dark);
	}

	/* Smaller than Bootstrap XL breakpoint */
	@@media all and (max-width: 1199.98px) {
		.wide-cover-image {
			height: 386px;
		}
	}

	/* Smaller than Bootstrap L breakpoint */
	@@media all and (max-width: 991.98px) {
		.wide-cover-image {
			height: 310px;
		}
	}

	/* Smaller than Bootstrap M breakpoint */
	@@media all and (max-width: 767.98px) {
		.wide-cover-image {
			height: 247px;
		}
	}

	/* Smaller than Bootstrap S breakpoint */
	@@media all and (max-width: 575.98px) {
		.wide-cover-image {
			height: 186px;
		}
	}
</style>
