@import se.lu.nateko.cp.meta.core.data.LinkBox
@import eu.icoscp.envri.Envri

@(linkBoxes:  Seq[LinkBox])(implicit envri: Envri)
<div class="container-xl">
	<div class="row my-5">
	@for(linkBox <- linkBoxes){
		@if(envri == Envri.SITES) {
		<div class="col-md-4 position-relative mb-4">
			<a href="@linkBox.target">
				<div class="link-box-image">
					<img src=@linkBox.coverImage class="img-fluid w-100 rounded-4" style="height: 230px; object-fit: cover;">
					<div class="link-box-title position-absolute bottom-0 text-white m-3 fs-4 fw-bold">@linkBox.name</div>
				</div>
			</a>
		</div>
		} else {
		<div class="col-md-4 mb-5">
			<div class="mb-3">
				<a href="@linkBox.target" tabindex="-1">
					<img src=@linkBox.coverImage class="img-fluid w-100" style="width: 100%; object-fit: cover; aspect-ratio: 16/9; border-radius: 0.4rem;">
				</a>
			</div>
			<div>
				<h3 class="h6">
					<a href="@linkBox.target" class="text-dark text-decoration-none right-arrow">@linkBox.name</a>
				</h3>
			</div>
		</div>
		}
	}
	</div>
</div>
